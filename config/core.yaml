# Core Configuration for Adaptive Extractor
version: 1

# Project-wide metadata and logging settings
project:
  # Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  log_level: "INFO"

# Large Language Model (LLM) instances for extraction and verification
llm:
  # Ingestor model: used for document ingestion pipeline (e.g. chart extraction)
  ingestor:
    provider: "api"
    model: "qwen/qwen3.6-flash"
    temperature: 0.0
    top_p: 0.95
    enable_cache: true
    timeout: 300
    rate_limit_delay: 1.0
    max_retries: 3
    api:
      max_tokens: 8192
      base_url: "https://openrouter.ai/api/v1"
      reasoning:
        enabled: false
      openrouter_cache: true
      prompt_caching: true

  # Student model: used for fast, draft-quality extraction candidates
  student:
    provider: "api"
    model: "qwen/qwen3.5-27b"
    temperature: 0.1
    top_p: 0.1
    enable_cache: true
    # Request timeout in seconds
    timeout: 600
    # Wait delay in seconds between consecutive requests to avoid rate limits
    rate_limit_delay: 10.0
    max_retries: 3
    api:
      max_tokens: 8192
      base_url: "https://openrouter.ai/api/v1"
      reasoning:
        enabled: false
      openrouter_cache: true
      prompt_caching: true
      provider:
        require_parameter_support: true
        allow_fallbacks: false
        priority_order:
          - alibaba
          - atlas-cloud/fp8
          - deepinfra/fp8
          - siliconflow/fp8

  # Teacher model: high-capacity model used for generation, refinement, and validation
  teacher:
    provider: "api"
    model: "qwen/qwen3.5-397b-a17b"
    temperature: 1.0
    top_p: 0.9
    enable_cache: true
    # Request timeout in seconds
    timeout: 300
    # Wait delay in seconds between consecutive requests to avoid rate limits
    rate_limit_delay: 10.0
    max_retries: 5
    api:
      max_tokens: 8192
      base_url: "https://openrouter.ai/api/v1"
      reasoning:
        enabled: true
      openrouter_cache: true
      prompt_caching: true
      provider:
        require_parameter_support: true
        allow_fallbacks: false
        priority_order:
          - alibaba
          - streamlake
          - chutes/fp8
          - deepinfra/fp8
          - morph
          - parasail/fp8

# Directory and file system paths relative to the project root
paths:
  schema_file: "config/schema.yaml"
  baseline_prompt_file: "config/baseline_instruction.txt"
  pdf_dir: "data/raw/pdf"
  ground_truth_file: "data/raw/ground_truth/ground_truth.csv"
  splits_file: "data/raw/splits/pilot.json"
  ingestion_dir: "data/interim/ingestion"
  generated_prompt_file: "data/interim/reverse_engineering/generated_instruction.txt"
  agents_dir: "data/processed/agents"
  extracted_dir: "data/processed/extracted"

# Caching configurations for LLM responses
cache:
  # Maximum disk cache size in bytes (e.g. 30 GB)
  disk_size_limit_bytes: 30000000000
  # Maximum number of entries in memory cache
  memory_max_entries: 1000000

# Circuit breaker settings to protect against service outages
circuit_breaker:
  # Number of consecutive failures before tripping the circuit open
  failure_threshold: 8
  # Timeout in seconds to wait in open state before transitioning to half-open
  reset_timeout: 30.0
  # Maximum number of test calls permitted in half-open state
  half_open_max_calls: 1
