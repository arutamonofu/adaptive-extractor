# Document Ingestion and Ingestion Parser Configuration
# This file governs how PDFs are parsed into text/markdown formats.

parsing:
  # Overwrite already parsed markdown files if they exist
  overwrite: false

  # Number of concurrent files to parse
  concurrency: 1

  mineru:
    api_url: "https://mineru.net/api/v4"
    model_version: "vlm"
    poll_interval: 3
    poll_timeout: 600

  # Параметры экстракции данных из графиков (на уровне с mineru)
  chart_extraction:
    enabled: true


