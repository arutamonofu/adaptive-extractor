# Configuration for Reverse Engineering (RE) pipeline
re:
  # Size of corpus for RE (uses only train split documents)
  use_split: "train"
  
  # Directory for intermediate RE artifacts
  artifacts_dir: "data/interim/reverse_engineering"
  
  # Resume from cache (skip already completed steps)
  resume: false
  
  # Log LLM history for RE calls
  save_llm_history: true