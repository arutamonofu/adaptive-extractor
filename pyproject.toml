[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-extractor"
version = "0.1.0"
description = "Self-optimizing system for extracting scientific data from articles"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "Proprietary"}

dependencies = [
    "dspy>=3.1.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "tabulate>=0.9.0",
    "requests>=2.28.0",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "optuna>=3.0.0",
    "mlflow>=2.10.0",
    "google-genai>=1.0.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "pint>=0.24.0",
    "pot>=0.9.0",
    "rapidfuzz>=3.0.0",
    "simpleeval>=1.0.0",
]

[project.optional-dependencies]
chemistry = [
    "rdkit>=2024.03",
    "py2opsin>=1.0.0",
    "chembl-structure-pipeline>=1.0.0",
]
development = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "responses>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
research = [
    "jupyterlab>=4.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "umap-learn>=0.5.0",
    "statsmodels>=0.14.0",
    "transformers>=4.35.0",
]

[project.scripts]
ae-ingest = "ae.ingestion.cli:main"
ae-optimize-semantic = "ae.semantic_optimization.cli:main"
ae-optimize-syntactic = "ae.syntactic_optimization.cli:main"
ae-extract = "ae.extraction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ae"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "dspy.*",
    "pandas.*",
    "scipy.*",
    "matplotlib.*",
    "mlflow.*",
    "yaml",
    "dotenv",
    "tabulate",
    "requests",
    "statsmodels.*",
    "sklearn.*",
    "umap",
    "langchain.*",
    "langchain_core.*",
    "langchain_google_genai.*",
    "langchain_openai.*",
    "langgraph.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "unit: marks tests as unit tests",
]
log_cli = false
log_cli_level = "INFO"
addopts = ["-v", "--tb=short", "--strict-markers", "-ra"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]