services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: ae-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ae-app
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DSPY_CACHE_DIR=/root/.dspy_cache
    env_file:
      - .env
    tty: true
    stdin_open: true
    volumes:
      - .:/app
      - /app/.venv
      - dspy_cache:/root/.dspy_cache

volumes:
  mlflow_data:
  dspy_cache: